packages:
  - apps/*
  - libs/*
  - infra

catalog:
  effect: 4.1.0
  "@effect/ai-openai-compat": 4.1.0
  "@effect/ai-openrouter": 4.1.0
  "@effect/platform-browser": 4.1.0
  "@effect/platform-node": 4.1.0
  "@effect/sql-pg": 4.1.0
  "@effect/sql-pglite": 4.1.0
  "@effect/vitest": 4.1.0
  foldkit: 0.171.0
  "@foldkit/vite-plugin": 0.29.1
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

patchedDependencies:
  "@discordjs/voice@0.19.2": patches/@discordjs__voice@0.19.2.patch

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
