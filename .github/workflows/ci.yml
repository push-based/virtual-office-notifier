name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push supersedes a pull request's run. Runs on main can end in a deploy, so they all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Restore the task cache
        id: task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - run: vp run --log grouped ci

      # Vite Task only stores tasks that passed, so a failed run still saves the rest for the re-run.
      - name: Save the task cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

  # What a merge would change in production. Pull requests from forks get no secrets, so they skip it.
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
      # A plan can't compare secret values, so it never needs the real ones.
      DISCORD_CLIENT_ID: placeholder
      DISCORD_CLIENT_SECRET: placeholder
      SESSION_SECRET: placeholder
      SENTRY_CONSOLE_DSN: placeholder
      ACTIVITY_DATABASE_PASSWORD: placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true

      # A read-only account: it can see the VM and the bucket, and change nothing.
      - uses: google-github-actions/auth@v3
        id: gcp
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAN_SERVICE_ACCOUNT }}
          token_format: access_token

      # Alchemy reads an access token, not the federated credentials file the step writes.
      - run: vp run infra#plan
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GOOGLE_PROJECT_ID: virtual-office-notifier

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time, and never cancel one halfway through a restart.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Checked before anything ships, so the bot and the Activity never go out of step.
      - name: Require the Activity's deploy token
        if: env.CLOUDFLARE_DEPLOY_TOKEN == ''
        run: |
          echo "::error::The CLOUDFLARE_DEPLOY_TOKEN secret is not set, so nothing was deployed. See the Console setup in docs/setup.md."
          exit 1

      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true

      # The check job built every package for this commit; the bot's build replays from its cache.
      - uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: google-github-actions/auth@v3
        id: gcp
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - run: vp run bot#deploy
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_OFFICE_CHANNEL_ID: ${{ secrets.DISCORD_OFFICE_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECORDINGS_BUCKET: ${{ secrets.RECORDINGS_BUCKET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # After the bot, so the Console never ships ahead of the bot that reads its requests.
      # Alchemy hashes the Console's inputs and does nothing when they haven't changed.
      - run: vp run infra#deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_DEPLOY_TOKEN }}
          ALCHEMY_TELEMETRY_DISABLED: "1"
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SENTRY_CONSOLE_DSN: ${{ secrets.SENTRY_CONSOLE_DSN }}
          ACTIVITY_DATABASE_PASSWORD: ${{ secrets.ACTIVITY_DATABASE_PASSWORD }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GOOGLE_PROJECT_ID: virtual-office-notifier
